<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="+# 사티아 나델라 — AI 시대 기업의 미래: 토큰 자본과 학습 루프"><title>리포트</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#2d9162;--accent-d:#1f6745;--accent-mid:#52b788;--accent-light:#d8f0e3;
  --up:#1f9d57;--dn:#c0392b;--warn-bg:#fdecea;--warn-border:#f3c1bb;
  --text:#1a1a1a;--muted:#666;--border:#e0e0e0;--surface:#f8faf9;--bg:#fff;
  --header-grad:linear-gradient(135deg,#163d2b 0%,#1f6745 55%,#2b6f4e 100%);
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;
  color:var(--text);background:#eef0ee;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.page{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}
@media (max-width:768px){.page{padding:14px 10px 40px}}

/* ─ Header ─ */
.hdr{
  background:var(--header-grad);color:#eef6f0;
  border:1px solid var(--accent-d);border-radius:16px;
  padding:32px 36px 26px;margin-bottom:18px;
}
.hdr-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.08em;font-weight:700}
.hdr-meta .chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:5px 11px;border-radius:999px;color:#eef6f0}
.hdr-meta .chip.brand{background:#7ee3ad;color:#0c241a;border-color:#7ee3ad}
.hdr-meta .chip.brand .dot{width:7px;height:7px;border-radius:50%;background:#1f6745}
.hdr-meta .ey{color:#9fe0bd;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.hdr h1{font-size:32px;font-weight:900;line-height:1.22;letter-spacing:-.02em;margin:16px 0 12px;color:#eef6f0;word-break:keep-all}
.hdr .lead{font-size:16px;line-height:1.6;color:#cfeadd;max-width:920px;word-break:keep-all}
@media (max-width:640px){
  .hdr{padding:22px 20px 18px}
  .hdr h1{font-size:24px;margin:12px 0 8px}
  .hdr .lead{font-size:14.5px}
}

/* ─ Grid ─ */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{
  background:var(--bg);border:1px solid var(--border);border-radius:14px;
  padding:18px 22px;display:flex;flex-direction:column;min-width:0;
}
.card.s4{grid-column:span 4}
.card.s6{grid-column:span 6}
.card.s12{grid-column:span 12}
@media (max-width:900px){
  .card.s4,.card.s6{grid-column:span 12}
}

/* ─ Card header ─ */
.card>h2{
  font-size:16px;font-weight:800;color:var(--accent-d);
  display:flex;align-items:center;gap:9px;
  padding-bottom:9px;margin-bottom:12px;border-bottom:2px solid var(--accent);
  word-break:keep-all
}
.card>h2::before{
  content:"";width:5px;height:18px;background:var(--accent);border-radius:2px;flex:none
}
.card>h2 .seq{
  font-size:11px;font-weight:800;color:#fff;background:var(--accent);
  padding:3px 8px;border-radius:6px;letter-spacing:.04em
}

/* ─ Typography in card ─ */
.card h3{font-size:14px;font-weight:800;color:var(--accent-d);margin:10px 0 4px}
.card p{font-size:14px;line-height:1.65;margin:5px 0;word-break:keep-all}
.card ul,.card ol{margin:4px 0 4px 19px}
.card li{font-size:14px;line-height:1.6;margin:5px 0;word-break:keep-all}
.card blockquote{
  border:1px solid var(--accent-mid);background:var(--accent-light);
  border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.6;
  color:#163d2b;margin:7px 0
}
.card code{background:#eef2f0;padding:1px 5px;border-radius:4px;font-size:.92em;overflow-wrap:anywhere}
.card a{color:var(--accent-d);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;word-break:break-all;overflow-wrap:anywhere}
.card a:hover{color:var(--accent)}
.card strong{color:#0c241a}

/* ─ Tables ─ */
.tbl-wrap{
  overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin:6px 0
}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
th{
  background:var(--accent);color:#fff;padding:8px 11px;text-align:left;
  font-weight:700;font-size:12.5px;letter-spacing:.02em;word-break:keep-all
}
td{
  padding:7px 11px;border-bottom:1px solid var(--border);
  vertical-align:top;line-height:1.55;word-break:keep-all
}
td:first-child{font-weight:700;color:#0c241a;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:var(--surface)}

/* ─ Step flow (infographic) ─ */
.steps{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.step{
  display:flex;align-items:flex-start;gap:11px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px
}
.step .snum{
  flex:none;width:32px;height:32px;border-radius:8px;
  background:var(--accent);color:#fff;font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:center
}
.step .sbody{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.step .sbody b{font-size:14px;color:#0c241a;line-height:1.4;word-break:keep-all}
.step .sbody span{font-size:13px;color:var(--text);line-height:1.55;word-break:keep-all}

/* ─ Colors / states ─ */
.up{color:var(--up);font-weight:700}
.dn{color:var(--dn);font-weight:700}
.hl{color:var(--accent);font-weight:700}

/* ─ Infographic blocks (bars/kpi/donut/timeline) ─ */
.ig-bars{display:flex;flex-direction:column;gap:7px;margin:8px 0}
.ig-bar{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;align-items:center;gap:10px;font-size:13.5px}
.igb-l{font-weight:700;color:var(--accent-d);word-break:keep-all}
.igb-track{height:15px;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.igb-fill{display:block;height:100%;background:var(--accent)}
.igb-v{font-weight:700;color:var(--text);white-space:nowrap}
.ig-kpis{display:flex;flex-wrap:wrap;gap:11px;margin:8px 0}
.ig-kpi{flex:1;min-width:124px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 16px;display:flex;flex-direction:column;gap:3px}
.igk-v{font-size:27px;font-weight:900;color:var(--accent-d);line-height:1.1}
.igk-l{font-size:12.5px;color:var(--muted);font-weight:600}
.ig-donuts{display:flex;flex-wrap:wrap;gap:16px;margin:8px 0}
.ig-donut{display:flex;flex-direction:column;align-items:center;gap:6px}
.igd-ring{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.igd-ring::after{content:"";position:absolute;width:52px;height:52px;border-radius:50%;background:var(--bg)}
.igd-num{position:relative;z-index:1;font-size:16px;font-weight:800;color:var(--accent-d)}
.igd-l{font-size:13px;color:var(--text);font-weight:600;text-align:center;max-width:108px;word-break:keep-all}
.ig-timeline{display:flex;flex-direction:column;margin:8px 0 8px 5px;border-left:2px solid var(--accent-mid);padding-left:15px}
.ig-tl{position:relative;padding:6px 0}
.igt-dot{position:absolute;left:-21px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.igt-t{font-weight:800;color:var(--accent-d);font-size:13.5px;margin-right:8px}
.igt-x{font-size:13.5px;color:var(--text);line-height:1.55}
.ig-raw{font-size:13.5px;color:var(--text);white-space:pre-wrap;line-height:1.6}

/* ─ Footer ─ */
.foot{
  margin-top:22px;padding:14px 18px;text-align:center;
  font-size:12.5px;color:var(--muted);
  border:1px solid var(--border);border-radius:12px;background:#fff
}
.foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent-mid);margin-right:7px;vertical-align:middle}

/* ─ TOC strip ─ */
.toc{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 18px;padding:12px 16px;background:#fff;border:1px solid var(--border);border-radius:12px}
.toc .ti{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:5px}
.toc a{
  font-size:12.5px;font-weight:600;color:var(--accent-d);text-decoration:none;
  padding:5px 11px;border:1px solid var(--accent-light);border-radius:999px;
  background:var(--accent-light)
}
.toc a:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (max-width:640px){
  .grid{gap:11px}
  .card{padding:14px 15px;border-radius:12px}
  .card>h2{font-size:15px}
  .card p,.card li,.card h3{font-size:14.5px}
  table{font-size:13px}
  th{padding:7px 9px;font-size:12px}
  td{padding:6px 9px}
  td:first-child{white-space:normal}
  .toc{padding:10px 12px;gap:6px}
  .hdr-meta{font-size:11.5px;gap:7px}
}
@media print{
  body{background:#fff}.page{padding:14px}
  .card,.foot,.toc,.tbl-wrap{break-inside:avoid}
  .hdr{break-after:avoid}
}
</style></head><body><div class="page"><header class="hdr"><div class="hdr-meta"><span class="chip brand"><span class="dot"></span>xbot</span><span class="ey">xbot · 2026-06-15</span><span class="chip">🖥 웹리포트</span></div><h1>리포트</h1><p class="lead">+# 사티아 나델라 — AI 시대 기업의 미래: 토큰 자본과 학습 루프</p></header><nav class="toc"><span class="ti">목차</span><a href="#s1">원문 출처</a></nav><main class="grid"><section class="card s6" id="s1"><h2><span class="seq">01</span>원문 출처</h2><ul>

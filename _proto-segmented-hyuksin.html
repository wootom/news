<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세그먼트형 인포그래픽 프로토타입 — 혁신전파사 2026-07-02</title>
<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#1e2a32;--muted:#5c6b76;--teal:#0e9e7e;--line:#d9e0e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:56px 24px 80px}
header.page{border-bottom:2px solid var(--ink);padding-bottom:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
h1{font-size:clamp(1.7rem,3.6vw,2.5rem);font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:.35em 0 .25em}
.sub{color:var(--muted);font-size:1rem;max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.chip b{color:var(--teal)}
.arc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:30px 0 34px;font-size:13px;font-weight:700;color:var(--muted)}
.arc span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
.arc i{color:var(--teal);font-style:normal;font-weight:800}
figure.chapter{margin:0 0 40px}
figcaption{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
figcaption .num{font-size:14px;font-weight:800;color:#fff;background:var(--teal);border-radius:7px;padding:3px 10px}
figcaption .role{font-size:1.05rem;font-weight:800}
figcaption .ttl{font-size:.95rem;color:var(--muted)}
figure.chapter img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 8px 30px rgba(30,42,50,.10)}
footer.note{margin-top:28px;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:10px;font-size:.92rem;color:var(--muted)}
footer.note b{color:var(--ink)}
</style></head><body>
<div class="wrap">
<header class="page">
<div class="eyebrow">Daybreak · 세그먼트형 인포그래픽 프로토타입</div>
<h1>중국이 하드웨어·AI 제조 세계 최강인 이유</h1>
<p class="sub">혁신전파사 2026-07-02 롱폼(48분)을 4단 서사 아크로 나눠, 챕터마다 이미지를 개별 생성한 뒤 세로로 조립했습니다.</p>
<div class="meta"><span class="chip"><b>4</b> 챕터</span><span class="chip">생성 <b>ChatGPT</b></span><span class="chip">규격 <b>1672×941</b> 통일</span><span class="chip">동일 <b>스타일 계약</b></span></div>
</header>
<div class="arc">서사 아크 <i>→</i> <span>질문</span> <i>→</i> <span>관찰</span> <i>→</i> <span>본질</span> <i>→</i> <span>제안</span></div>
    <figure class="chapter">
      <figcaption><span class="num">01</span><span class="role">질문</span><span class="ttl">왜 중국이 세계 최강 제조·AI 강국인가</span></figcaption>
      <img src="./assets/proto/ch01.jpg" alt="챕터 01 질문" loading="lazy">
    </figure>
    <figure class="chapter">
      <figcaption><span class="num">02</span><span class="role">관찰</span><span class="ttl">현장의 속도와 공급망</span></figcaption>
      <img src="./assets/proto/ch02.jpg" alt="챕터 02 관찰" loading="lazy">
    </figure>
    <figure class="chapter">
      <figcaption><span class="num">03</span><span class="role">본질</span><span class="ttl">인재·규제·정부</span></figcaption>
      <img src="./assets/proto/ch03.jpg" alt="챕터 03 본질" loading="lazy">
    </figure>
    <figure class="chapter">
      <figcaption><span class="num">04</span><span class="role">제안</span><span class="ttl">생태계가 답, 그리고 '협력'</span></figcaption>
      <img src="./assets/proto/ch04.jpg" alt="챕터 04 제안" loading="lazy">
    </figure>
<footer class="note"><b>단일 이미지 vs 세그먼트.</b> 단일은 한눈 요약·빠른 1회 생성. 세그먼트는 4배 시간이 들지만 장면별 밀도·서사·프리미엄이 살아납니다. 일관성은 동일 스타일 계약+같은 모델로 확보됩니다.</footer>
</div></body></html>
